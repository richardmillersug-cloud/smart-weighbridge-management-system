name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-native:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, ctype, zip
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          "NATIVEPHP_APP_VERSION=$version" >> $env:GITHUB_ENV
          Set-Content -Path VERSION -Value $version -NoNewline
          Set-Content -Path installer/version.iss -Value @(
            "; Generated in CI from git tag",
            "#define AppVersion `"$version`""
          )

      - name: Install PHP dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Install NativePHP runtime
        run: php artisan native:install --no-interaction

      - name: Build frontend and app icon
        shell: pwsh
        run: |
          installer/scripts/build-icon.ps1
          npm install
          npm run build

      - name: Prepare native build environment
        run: php installer/scripts/prepare-native-ci.php

      - name: Build native Windows app
        run: php artisan native:build win --no-interaction

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $searchDirs = @(
            "nativephp/electron/dist",
            "vendor/nativephp/desktop/resources/electron/dist",
            "dist"
          )
          $exe = $null
          foreach ($dir in $searchDirs) {
            if (-not (Test-Path $dir)) { continue }
            $found = Get-ChildItem $dir -Recurse -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "elevate|hiddeninput" } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if ($found) { $exe = $found; break }
          }
          if (-not $exe) { throw "Native build produced no .exe (searched: $($searchDirs -join ', '))" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName "dist/SmartWeighbridge-Native.exe"
          Write-Host "Release artifact: dist/SmartWeighbridge-Native.exe ($([math]::Round($exe.Length/1MB,2)) MB) from $($exe.FullName)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartWeighbridge-Native.exe
            CUSTOMER-SETUP.md
            installer/NATIVE-DESKTOP.md
          generate_release_notes: true
