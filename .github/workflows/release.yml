name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, ctype
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          Set-Content -Path VERSION -Value $version -NoNewline
          Set-Content -Path installer/version.iss -Value @(
            "; Generated in CI from git tag",
            "#define AppVersion `"$version`""
          )

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Prepare release folder
        shell: pwsh
        run: |
          $ReleaseDir = "dist/SmartWeighbridgeRelease"
          if (Test-Path $ReleaseDir) { Remove-Item $ReleaseDir -Recurse -Force }
          New-Item -ItemType Directory -Path $ReleaseDir -Force | Out-Null
          robocopy . $ReleaseDir /MIR /XD .git node_modules dist tests .phpunit.cache storage/logs storage/framework/cache storage/framework/sessions storage/framework/views /XF .env .env.backup composer.phar php-local.ini /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit code $LASTEXITCODE" }
          @(
            "storage/logs", "storage/framework/cache", "storage/framework/sessions",
            "storage/framework/views", "storage/app/public", "storage/certs", "bootstrap/cache"
          ) | ForEach-Object {
            $path = Join-Path $ReleaseDir $_
            if (-not (Test-Path $path)) { New-Item -ItemType Directory -Path $path -Force | Out-Null }
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc installer/SmartWeighbridge.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartWeighbridge-Setup.exe
            CUSTOMER-SETUP.md
          generate_release_notes: true
