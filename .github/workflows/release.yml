name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, ctype
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          Set-Content -Path VERSION -Value $version -NoNewline
          Set-Content -Path installer/version.iss -Value @(
            "; Generated in CI from git tag",
            "#define AppVersion `"$version`""
          )

      - name: Build release folder
        shell: pwsh
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build
          & installer/scripts/build-release.ps1

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc installer/SmartWeighbridge.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartWeighbridge-Setup.exe
            CUSTOMER-SETUP.md
          generate_release_notes: true
