name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, ctype, zip
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          Set-Content -Path VERSION -Value $version -NoNewline
          Set-Content -Path installer/version.iss -Value @(
            "; Generated in CI from git tag",
            "#define AppVersion `"$version`""
          )

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build frontend and app icon
        shell: pwsh
        run: |
          installer/scripts/build-icon.ps1
          npm ci
          npm run build

      - name: Prepare release folder
        shell: pwsh
        run: installer/scripts/prepare-release-folder.ps1

      - name: Compile Windows installer
        shell: pwsh
        run: installer/scripts/compile-inno-setup.ps1

      - name: Verify installer has no Electron runtime
        shell: pwsh
        run: installer/scripts/verify-release-build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartWeighbridge-Setup.exe
            CUSTOMER-SETUP.md
          generate_release_notes: true
